<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscriptions Hub - Dev</title>
    <!--
      Dev-server landing page. Vite's rollup inputs are listed explicitly in
      vite.config.ts, so this file is never part of dist/ and never ships.
      It exists because `pnpm dev` serves the project root, which has no entry
      point of its own — hitting / used to render a blank page.
    -->
    <link rel="stylesheet" href="./src/ui/shared/tokens.css">
    <style>
      body {
        font-family: var(--font-family);
        font-size: var(--font-size-base);
        background-color: var(--layout-background-1);
        color: var(--layout-color-1);
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 520px;
        width: 100%;
        background-color: var(--layout-background-0);
        border: 1px solid var(--layout-border-0);
        border-radius: var(--radius-md);
        padding: 24px;
      }
      h1 { font-size: 1.0625rem; margin: 0 0 4px; }
      p { color: var(--layout-color-2); margin: 0 0 20px; font-size: 0.8125rem; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      a {
        display: block;
        padding: 10px 12px;
        border: 1px solid var(--layout-border-0);
        border-radius: var(--radius-sm);
        color: inherit;
        text-decoration: none;
      }
      a:hover { background-color: var(--layout-background-1); }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.75rem; }
      .hint { color: var(--layout-color-3); font-size: 0.75rem; margin: 20px 0 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Subscriptions Hub — dev server</h1>
      <p>Extension pages, running outside Thunderbird on demo data.</p>
      <ul>
        <li><a href="/dashboard.html">Dashboard</a></li>
        <li><a href="/options.html">Settings (options_ui)</a></li>
        <li><a href="/background.html">Background page</a></li>
      </ul>
      <p class="hint">
        The dashboard seeds demo data on first load.
        <code>?seed=force</code> rebuilds it, <code>?seed=clear</code> empties it.
      </p>
    </main>
  </body>
</html>
