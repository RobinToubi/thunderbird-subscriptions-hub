<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#hubGrad)" />
  
  <!-- Mail envelope outline -->
  <rect x="14" y="20" width="36" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Envelope flap -->
  <polyline points="14,22 32,35 50,22" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Badge tick / sparkles indicating subscription management -->
  <circle cx="48" cy="18" r="8" fill="#10b981" />
  <polyline points="44,18 47,21 52,15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
